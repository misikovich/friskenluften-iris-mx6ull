image boot.vfat {
  vfat {
    label = "IRISINST"
    files = {
      "imx6ull-14x14-evk.dtb",
      "zImage",
      "u-boot-dtb.imx",
      "rootfs.ubi",
      "install.sha256"
    }
  }
  size = 64M
}

image sdcard.img {
  hdimage {
  }

  partition u-boot {
    in-partition-table = "no"
    image = "u-boot-dtb.imx"
    offset = 1024
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
    offset = 8M
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext2"
  }
}
